server:
  port: 9300

spring:
  application:
    name: example-service
  # 对齐 access-service 模式：无 bootstrap starter，Nacos 远端配置经 config.import 加载
  config:
    import: optional:nacos:example-service.yml
  cloud:
    nacos:
      # T-ACCESS-047：占位符化（默认值=原硬编码，本地 dev 零参数行为不变；容器化经 NACOS_SERVER_ADDR 覆盖）
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yml

logging:
  config: classpath:log4j2-spring.xml

# 本服务无缓存消费（common 缓存装配关闭；caffeine 在 common 为 optional 依赖未传递）。
# 全局 ObjectMapper 由 Spring Boot 自动配置提供，Jackson 默认时区即 UTC，与全链路 UTC 语义一致。
accessmesh:
  cache:
    enabled: false

# 业务最终检查客户端（T-ACCESS-061，§8.6 逐路由）：经 perm-client SDK（Feign）调
# access-service auth/check 族端点。服务认证=内部密钥通道（SDK FeignInternalSyncInterceptor
# 注入 X-Internal-Secret/X-Service-Code）；X-Tenant-Id 由本服务 FeignTenantHeaderInterceptor
# 从 BusinessPermChecker 调用上下文注入。密钥未配置时 check 调用被 access-service 拒绝，
# 业务侧 fail-closed（30005）——不会静默放行。
perm:
  client:
    enabled: true
  internal-secret: ${PERM_INTERNAL_SECRET:}
  service-code: example-service

example:
  export:
    # 异步导出作业执行时点重查的演示延迟（毫秒）：窗口内撤权 → 执行时点检查拒绝（N24）
    delay-ms: 1500
