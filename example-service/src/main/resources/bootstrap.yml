server:
  port: 9300

spring:
  application:
    name: example-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
  datasource:
    # serverTimezone 残留已删（T-ACCESS-024）：MySQL 语义参数，pgjdbc 忽略且误导
    url: jdbc:postgresql://127.0.0.1:5432/example_db?useSSL=false
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 默认与 docker-compose.yml 的开发密码一致（Redisson 对空串密码也发 AUTH）
      password: ${REDIS_PASSWORD:accessmesh-dev}
      database: 2

mybatis-flex:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: cn.ac.fage.accessmesh.example.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  config: classpath:log4j2-spring.xml
