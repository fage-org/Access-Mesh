spring:
  cloud:
    loadbalancer:
      retry:
        enabled: false
  jackson:
    date-time-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

perm:
  cache:
    l1:
      maximum-size: 1000
      expire-minutes: 10
    l2:
      ttl-minutes: 30

logging:
  level:
    cn.ac.fage.accessmesh: INFO
    org.springframework.cloud.loadbalancer: WARN

# 延迟补偿定时任务配置（M13）
permission:
  orphan-cleanup:
    # 扫描间隔（毫秒），默认 5 分钟
    interval: 300000
    # 窗口期（分钟），仅清理 update_time 早于 now - windowMinutes 的记录，给 envelope 处理留时间
    window-minutes: 5
