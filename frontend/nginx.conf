# AccessMesh 前端 nginx 配置（T-ACCESS-047）
# 同源反代：前端 axios 全相对路径 /api/**（无 baseURL），生产形态必须经同源 nginx 反代到 Gateway。
# 路径原样透传（无 rewrite）——与 T-ACCESS-042「外部路径=服务路径、无 StripPrefix」一致。
# 注意：不设置 X-Forwarded-For / X-Real-IP——Gateway HeaderCleanFilter 会清洗外部值并以
# 自身观测 remoteAddr 重建 XFF（T-GW-008 信任面设计），设置反而冗余。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 对齐 access-service multipart 上限（100MB）——文件上传经 /api 反代，nginx 默认 1m 会先拦
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        # 100MB 上传在慢链路下会超 nginx 默认 60s 读超时（client_max_body_size 放行了请求但响应被 504 截断）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA 路由回退（前端路由 history 模式直达刷新）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
