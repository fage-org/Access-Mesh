# T-ACCESS-003 评审修复（P1，2026-08-14）：由 bootstrap.yml 迁移至 application.yml。
# Boot 3 / Spring Cloud 2023 默认不加载 bootstrap.yml（无 spring-cloud-starter-bootstrap、
# 无 bootstrap.enabled=true），原配置（sa-token/Redis/路由/Nacos）实际全部失效：
# Gateway 用默认 token-name=satoken 读不到 access-service 写入的 Authorization:login:* 会话。
# 迁移后走 Boot 3 标准 ConfigData：application.yml 本地配置 + spring.config.import 加载 Nacos。
server:
  port: 8080

spring:
  application:
    name: gateway
  config:
    import: optional:nacos:gateway.yml
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
    # T-ACCESS-003 评审 P1 修复（2026-08-14）：路由前缀 spring.data.gateway.* → spring.cloud.gateway.*。
    # 原配置前缀错误（Spring Cloud Gateway 属性前缀为 spring.cloud.gateway），
    # 路由定义从未被 PropertiesRouteDefinitionLocator 加载（归并前既有缺陷，由新 Gateway 上下文测试暴露）。
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # 管理与权限服务（T-ACCESS-010：admin-service/permission-center 归并为唯一部署单元，
        # /admin/** 与 /perm/** 路径行为不变，目标统一为 access-service）
        - id: access-service
          uri: lb://access-service
          predicates:
            - Path=/admin/**,/perm/**
          filters:
            - StripPrefix=1
          metadata:
            serviceCode: access-service

        # 演示服务
        - id: example-service
          uri: lb://example-service
          predicates:
            - Path=/example/**
          filters:
            - StripPrefix=1
          metadata:
            serviceCode: example-service

        # 认证接口（转发到 access-service）
        - id: auth-routes
          uri: lb://access-service
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=0

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      # T-GW-007 CORS 环境化（用户口径 2026-08-25：生产 nginx 同源代理，CORS 无生产消费场景）：
      # - 默认 http://localhost:8848 仅供开发直连调试（前端 dev 实际端口，vite 代理模式下同源不触发 CORS）
      # - GATEWAY_CORS_ALLOWED_ORIGINS 显式置空 = CORS 禁用（同源部署终态：跨域请求被主动 403 拒绝且无 CORS 头）
      # - 通配 origin（含 "*"）+ allow-credentials=true 由 GatewayCorsConfigValidator 启动 fail-fast 拒绝
      # - 注意 Nacos 远端 gateway.yml 优先级更高：远端覆盖值同样经校验器（含旧 "*" 值会启动失败）
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:8848}
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 默认与 docker-compose.yml 的开发密码一致（Redisson 对空串密码也发 AUTH）
      password: ${REDIS_PASSWORD:accessmesh-dev}
      database: 0
      timeout: 3000

sa-token:
  # T-ACCESS-003：与 access-service 统一（token-name/token-prefix/token-style/timeout/active-timeout/会话键）
  # 权威值：token-name=Authorization、token-prefix=Bearer、token-style=uuid、timeout=7200（2h）、active-timeout=1800（30min 滑动续期）
  # login-type：Sa-Token 无该配置键，两侧均为 StpUtil.login() 默认类型 "login"（文档口径，非配置项）
  # Gateway 不签发 token，仅按 token 值查共享 Redis（database 0）校验用户会话；会话键格式
  # token-name:login-type:token:<token>（即 Authorization:login:token:*，无 "satoken:" 前缀常量）
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-read-header: true
  is-read-cookie: true
  is-log: false

gateway:
  whitelist:
    paths:
      # T-GW-007：/actuator/** 已全部移出主端口白名单——actuator 经独立管理端口提供
      # （management.server.port，见下方 management 段），主端口 8080 不再暴露任何 /actuator/** 端点
      - /auth/**
      - /public/**
      - /captcha/**

  # T-ACCESS-013：OAuth2 委托令牌透传路径（外部路径口径；默认为空=无业务路径默认开放）。
  # 命中路径且 Authorization 为 Bearer 三段式 JWT 时跳过会话/权限校验与身份头注入，
  # Authorization 原样透传下游，由 access-service 开放路径门禁（access.oauth2.resource-paths
  # + scope/audience/client_id 启用校验）判定；平台 uuid 会话令牌不启用透传（走正常
  # 会话校验与接口鉴权，防绕过 Gateway 权限）；/auth/** 已由白名单覆盖无需重复配置。
  # 注意：下游匹配的是 StripPrefix 后路径（如 /admin/api/** → 下游 /api/**），双侧需人工对应。
  oauth2:
    passthrough-paths: []

  # T-ACCESS-008：快照缓存 TTL/容量统一由 GatewayCacheCatalog 声明（15s/50000），
  # 运维覆盖走 accessmesh.cache.catalogs."[gw:interface-snapshot]".l1-ttl / l1-maximum-size；
  # 原 gateway.cache.l1.*（ttl-seconds/stale-grace-seconds）随 stale-allow 删除废弃。

  header:
    clean:
      - X-User-Id
      - X-Tenant-Id
      - X-User-Name
      - X-User-Roles
      - X-User-Type
      - X-Internal-Secret
      - X-User-Signature
      - X-Signature-Timestamp
    enrich:
      request-id: X-Request-Id
      tenant-id: X-Tenant-Id
      user-id: X-User-Id
      user-name: X-User-Name
      user-type: X-User-Type

  permission:
    # T-ACCESS-010：目标统一为 access-service
    service-url: lb://access-service
    check-interface-path: /api/perm/auth/check-interface
    # T-PERM-001 快照模式：Gateway 拉取用户全量接口权限快照用于本地匹配
    interface-snapshot-path: /api/perm/auth/interface-snapshot
    unregistered-policy: DENY
    # T-ACCESS-008：快照加载全链路墙钟硬截止（服务发现/LB、连接、发送、处理、
    # 响应读取解码及失效竞争重试共享同一截止）；超时不写缓存固定 fail-closed 503。
    # 上限 5s，超限启动失败（GatewayCacheBoundaryValidator）；原 gateway.permission.fail-mode
    # 已删除——回源失败固定 fail-closed，不可切换。
    snapshot-load-deadline: 5s

  # Header signature configuration
  # Signs user identity headers (X-User-Id, X-Tenant-Id) to prevent tampering
  # FIX #5: removed enabled config - signature generation is always enforced in code
  signature:
    # Secret key for HMAC-SHA256 signing
    # MUST be configured via environment variable: ACCESSMESH_SIGNATURE_SECRET
    # Must match perm.signature.secret in access-service
    secret: ${ACCESSMESH_SIGNATURE_SECRET:}
    header-name: X-User-Signature
    timestamp-header-name: X-Signature-Timestamp

# T-GW-004：Actuator + Prometheus 端点
# T-GW-007：actuator 与主端口分离——health/info/prometheus/metrics 全部仅经独立管理端口提供，
# 主端口 8080 无任何 /actuator/** 端点（白名单同步移除）；存活/就绪探针与 Prometheus 抓取改访问管理端口。
# 管理端口默认绑定回环地址（仅同机可达）；远程抓取/容器化部署经 GATEWAY_MANAGEMENT_ADDRESS 放开。
# 注意：GATEWAY_MANAGEMENT_PORT 不支持空串禁用——空串经 Binder 绑定为 null（等于未配置），
# 会使管理端口分离静默回退（actuator 回到主端口匿名可达）；放开/覆盖必须给完整值。
# 注意 Nacos 远端 gateway.yml 优先级更高，生产覆盖需保持一致的收敛口径（远端旧值同样受
# GatewayCorsConfigValidator 与本端口默认值约束面控制）。
management:
  server:
    port: ${GATEWAY_MANAGEMENT_PORT:8081}
    address: ${GATEWAY_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

logging:
  config: classpath:log4j2-spring.xml

perm:
  # Internal API secret injected as X-Internal-Secret header to downstream services.
  # Must match perm.internal-secret in access-service.
  internal-secret: ${PERM_INTERNAL_SECRET:}
