server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # 管理服务
        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/admin/**
          filters:
            - StripPrefix=1
          metadata:
            serviceCode: admin-service

        # 权限中心
        - id: permission-center
          uri: lb://permission-center
          predicates:
            - Path=/perm/**
          filters:
            - StripPrefix=1
          metadata:
            serviceCode: permission-center

        # 演示服务
        - id: example-service
          uri: lb://example-service
          predicates:
            - Path=/example/**
          filters:
            - StripPrefix=1
          metadata:
            serviceCode: example-service

        # 认证接口（转发到管理服务）
        - id: auth-routes
          uri: lb://admin-service
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=0

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-cookie: true
  is-log: false

gateway:
  whitelist:
    paths:
      - /auth/**
      - /actuator/health
      - /public/**
      - /captcha/**

  cache:
    l1:
      max-size: 50000
      # T-PERM-001 快照模式：TTL 兜底 30s，快照失效主要靠 Redis pub/sub 主动广播（T-PERM-006）
      ttl-seconds: 30

  header:
    clean:
      - X-User-Id
      - X-Tenant-Id
      - X-User-Name
      - X-User-Roles
      - X-User-Type
      - X-Internal-Secret
      - X-User-Signature
      - X-Signature-Timestamp
    enrich:
      request-id: X-Request-Id
      tenant-id: X-Tenant-Id
      user-id: X-User-Id
      user-name: X-User-Name
      user-type: X-User-Type

  permission:
    service-url: lb://permission-center
    check-interface-path: /api/perm/auth/check-interface
    # T-PERM-001 快照模式：Gateway 拉取用户全量接口权限快照用于本地匹配
    interface-snapshot-path: /api/perm/auth/interface-snapshot
    unregistered-policy: DENY

  # Header signature configuration
  # Signs user identity headers (X-User-Id, X-Tenant-Id) to prevent tampering
  # FIX #5: removed enabled config - signature generation is always enforced in code
  signature:
    # Secret key for HMAC-SHA256 signing
    # MUST be configured via environment variable: ACCESSMESH_SIGNATURE_SECRET
    # Must match perm.signature.secret in permission-center
    secret: ${ACCESSMESH_SIGNATURE_SECRET:}
    header-name: X-User-Signature
    timestamp-header-name: X-Signature-Timestamp

logging:
  config: classpath:log4j2-spring.xml

perm:
  # Internal API secret injected as X-Internal-Secret header to downstream services.
  # Must match perm.internal-secret in permission-center.
  internal-secret: ${PERM_INTERNAL_SECRET:}
