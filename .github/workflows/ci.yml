# CI：后端单测、后端容器收口与前端质量门禁。
# - unit-tests：全量单测强制通过（push / PR / 手动），排除 @Tag("testcontainers") 容器测试
#   与 e2e 模块（T-ACCESS-031：E2E 是收口资产，runner 自带 Docker 会照跑，必须显式跳过）
# - testcontainers：容器门控（PR / 手动触发），全量 mvn test（含 Testcontainers 与 E2E）
# - frontend：前端质量门禁（push / PR / 手动触发，无 if 即全触发面——pnpm 钉死版本，
#   test/lint/typecheck/build 与已登记 DTO 对账）
# 口径：以测试退出状态判定成功，不维护测试数量计数；不建发布流水线与多分支矩阵。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  dependency-security:
    name: 依赖安全扫描（高危阻断）
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.5.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 解析并安装 reactor 依赖
        run: mvn -B install -DskipTests -Dspring-boot.repackage.skip=true
      - name: Maven 已解析依赖扫描（包含 test/provided）
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p reports/maven
          scan_status=0
          mvn -B org.owasp:dependency-check-maven:12.2.2:aggregate \
            -Dstyle.color=never -DfailBuildOnCVSS=7.0 -DfailOnError=true \
            -DsuppressionFiles=tools/security/dependency-check-suppressions.xml \
            -DskipTestScope=false -DskipProvidedScope=false \
            -Dformats=HTML,JSON -Dodc.outputDirectory=reports/maven \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
            -DossIndexAnalyzerEnabled=false -DnodeAuditAnalyzerEnabled=false \
            > reports/maven/scan.log 2>&1 || scan_status=$?
          cat reports/maven/scan.log
          # Dependency Check can log individual CVE import errors and continue.
          risk_status=0
          node --test tools/security/check-maven-audit.test.mjs || risk_status=$?
          node tools/security/check-maven-audit.mjs reports/maven/dependency-check-report.json || risk_status=$?
          if grep -q '^\[ERROR\]' reports/maven/scan.log; then
            exit 1
          fi
          if [ "$scan_status" -ne 0 ]; then exit "$scan_status"; fi
          exit "$risk_status"
      - name: pnpm 锁定依赖扫描（包含开发依赖）
        if: always()
        working-directory: frontend
        run: |
          mkdir -p ../reports/pnpm
          pnpm install --frozen-lockfile --ignore-scripts
          node --test ../tools/security/check-pnpm-audit.test.mjs
          audit_status=0
          pnpm audit --audit-level high --json > ../reports/pnpm/audit.json || audit_status=$?
          node ../tools/security/check-pnpm-audit.mjs ../reports/pnpm/audit.json "$audit_status"
      - name: 保存安全报告（包括阻断结果）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-security-reports
          path: reports/
          retention-days: 30
          if-no-files-found: error

  unit-tests:
    name: 单元测试（强制）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 全量单测（排除 Testcontainers 与 E2E）
        run: |
          started=$SECONDS
          status=0
          mvn -B test -DskipTestcontainers=true -DskipE2E=true || status=$?
          echo "单测耗时：$((SECONDS - started)) 秒" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  testcontainers:
    name: Testcontainers（PR / 手动触发）
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 全量测试（含 Testcontainers，GitHub runner 自带 Docker）
        run: |
          started=$SECONDS
          status=0
          mvn -B test -T 1C || status=$?
          echo "收口测试耗时：$((SECONDS - started)) 秒" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  frontend:
    name: 前端（lint / typecheck / Vitest / DTO）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:check
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm contracts:check
      - run: pnpm build
