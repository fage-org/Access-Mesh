# 最小 CI（T-ACCESS-017）：单个 Maven workflow，两个 job。
# - unit-tests：全量单测强制通过（push / PR / 手动），排除 @Tag("testcontainers") 容器测试
# - testcontainers：容器门控（PR / 手动触发），全量 mvn test（含 Testcontainers）
# 口径：以测试退出状态判定成功，不维护测试数量计数；不建发布流水线与多分支矩阵。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: 单元测试（强制）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 全量单测（排除 Testcontainers）
        run: mvn -B test -DexcludedGroups=testcontainers

  testcontainers:
    name: Testcontainers（PR / 手动触发）
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 全量测试（含 Testcontainers，GitHub runner 自带 Docker）
        run: mvn -B test
