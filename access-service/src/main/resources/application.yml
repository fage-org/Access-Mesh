server:
  port: 9100

spring:
  application:
    name: access-service
  config:
    import: optional:nacos:access-service.yml
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
  datasource:
    # stringtype=unspecified（T-ACCESS-002 评审修复）：全项目 JSONB 列由实体 String 映射，
    # PGJDBC 默认 stringtype=VARCHAR 在真实 PostgreSQL 上对 JSONB 列写入报 42804 类型不匹配；
    # unspecified 让服务端按目标列推断类型（PGJDBC 官方推荐），一处配置覆盖全部 JSONB 列。
    url: jdbc:postgresql://127.0.0.1:5432/access_db?useSSL=false&serverTimezone=Asia/Shanghai&stringtype=unspecified
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
  jackson:
    date-time-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 1000
        keep-alive: 60s
      thread-name-prefix: access-async-

sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: jwt
  is-log: false
  jwt-secret-key: ${JWT_SECRET_KEY}

mybatis-flex:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: cn.ac.fage.accessmesh.access.admin.entity,cn.ac.fage.accessmesh.access.permission.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

perm:
  internal-secret: ${PERM_INTERNAL_SECRET:}
  signature:
    secret: ${ACCESSMESH_SIGNATURE_SECRET:}
    valid-seconds: 300
  cache:
    l1:
      maximum-size: 1000
      expire-minutes: 10
    l2:
      ttl-minutes: 30

file:
  storage:
    path: ${user.home}/accessmesh-files

cache:
  caffeine:
    spec: maximumSize=1000,expireAfterWrite=10m

permission:
  orphan-cleanup:
    interval: 300000
    window-minutes: 5

logging:
  config: classpath:log4j2-spring.xml
  level:
    cn.ac.fage.accessmesh: INFO
    org.springframework.cloud.loadbalancer: WARN
