server:
  port: 9100

spring:
  application:
    name: access-service
  config:
    import: optional:nacos:access-service.yml
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
  datasource:
    # stringtype=unspecified（T-ACCESS-002 评审修复）：全项目 JSONB 列由实体 String 映射，
    # PGJDBC 默认 stringtype=VARCHAR 在真实 PostgreSQL 上对 JSONB 列写入报 42804 类型不匹配；
    # unspecified 让服务端按目标列推断类型（PGJDBC 官方推荐），一处配置覆盖全部 JSONB 列。
    # serverTimezone 残留已删（T-ACCESS-024）：MySQL 语义参数，pgjdbc 忽略且误导；
    # TIMESTAMPTZ 换算由 TypeHandler 显式 UTC 承担，JVM 时区由 common EPP 强制 UTC。
    url: jdbc:postgresql://127.0.0.1:5432/access_db?useSSL=false&stringtype=unspecified
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 默认与 docker-compose.yml 的开发密码一致（Redisson 对空串密码也发 AUTH，无密码 Redis 连不上）
      password: ${REDIS_PASSWORD:accessmesh-dev}
      database: 0
  # 第三轮评审 P3 修复（2026-08-14）：spring.jackson.* 配置块已删除——date-time-format 非 Boot
  # 有效键（JacksonProperties 仅暴露 date-format），且全局 ObjectMapper 由 common cacheObjectMapper
  # 提供（JavaTimeModule + 禁用时间戳，LocalDateTime 输出 ISO-8601），spring.jackson.* 不驱动全局，
  # 保留无效配置误导维护。
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 1000
        keep-alive: 60s
      thread-name-prefix: access-async-
    # T-ACCESS-009：共享调度器池（cron 触发/对账/接管扫描共用；维护任务在线程内做
    # 数据库 IO，默认单线程会互相饿死）。租约续租不在此池——专用 taskLeaseRenewalScheduler。
    scheduling:
      pool:
        size: 2

# T-ACCESS-009：sys_job 任务执行专用有界线程池（与审计异步 accessAsyncExecutor 容量隔离）。
# 拒绝语义：队列满/停机时放弃本次提交并告警，执行租约到期后由接管扫描器按至少一次语义重试。
access:
  task:
    executor:
      core-size: 2
      max-size: 4
      queue-capacity: 100
      keep-alive: 60s
  # T-ACCESS-013：OAuth2 资源服务器开放路径（显式配置、默认拒绝；Ant 通配允许）。
  # 每条规则：path（必填）+ requiredScopes（令牌 scope 子集校验，独立映射）+
  # audience（业务路径强制受众）+ clientIds（可选客户端限定）。
  # 业务开放路径（非 userinfo）必须声明 requiredScopes 与 audience——缺失启动失败
  # （防配置遗漏静默放行）；userinfo 默认豁免两项（仅验签+黑名单+客户端启用）。
  # 显式配置为全量替换（非合并），新增业务路径必须保留 userinfo 条目；
  # 非 /auth/** 前缀的开放路径需同步在 Gateway gateway.oauth2.passthrough-paths
  # 放行透传（仅 Bearer 三段式 JWT 透传；平台会话仍走 Gateway 正常鉴权）。
  # client_id 启用状态动态校验（禁用立即失效）对所有开放路径恒定生效，无需配置。
  oauth2:
    resource-paths:
      - path: /auth/oauth2/userinfo
  # T-ACCESS-020：空库 bootstrap（幂等首管理员种子）。默认关闭；仅单实例启用
  # （无分布式锁，多实例同时启用存在并发建号风险，唯一约束仅兜底）。
  # enabled=true 时 ACCESS_BOOTSTRAP_ADMIN_PASSWORD 缺失/空白启动失败（fail-fast，密码不写日志）。
  # 幂等三状态：固定图不存在→单事务创建 / 完整匹配→no-op 绝不重置密码 / 部分存在或业务键被占→启动失败报冲突。
  bootstrap:
    enabled: ${ACCESS_BOOTSTRAP_ENABLED:false}
    admin-password: ${ACCESS_BOOTSTRAP_ADMIN_PASSWORD:}

sa-token:
  # T-ACCESS-003：平台用户会话与 Gateway 统一（token-name/token-prefix/token-style/timeout/active-timeout/会话键）
  # 权威值：token-name=Authorization、token-prefix=Bearer（前端恒发 "Authorization: Bearer <token>"，
  # 剥离前缀后按 token 查 Redis；缺失时整个 "Bearer <uuid>" 会被当作 token 查键导致全部会话校验 401）、
  # token-style=uuid（uuid 模式下无密钥概念，会话有效性以共享 Redis 条目为唯一事实，Redis 清空后两端一致失效 fail-closed）、
  # timeout=7200（2h，也是 LoginResp.expiresIn 的单一权威来源——评审 P2 修复后无独立 expiresIn 键）、
  # active-timeout=1800（30min 滑动续期）。
  # 会话键格式：token-name:login-type:token:<token>（即 Authorization:login:token:*，无 "satoken:" 前缀常量）。
  # login-type：Sa-Token 无该配置键，两侧均为 StpUtil.login() 默认类型 "login"（文档口径，非配置项）。
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: uuid
  # 登录不种 Authorization Cookie：sa-token 默认 isReadCookie=true，不显式关闭时
  # StpUtil.login 会在响应 Set-Cookie Authorization=<token>（无 SameSite/HttpOnly/Secure
  # 标记，Safari/旧浏览器跨站请求自动携带 = CSRF 面）；令牌仅经 Authorization 头显式
  # 传递（前端恒发 Bearer），Gateway 读侧已同步关闭 Cookie 备选
  is-read-cookie: false
  is-log: false
  # jwt-secret-key 仅用于 OAuth2 访问令牌签发（SaJwtUtil HS256），与平台用户会话 token-style 无关；
  # 无默认值，缺失时 Spring 占位符解析失败 → 启动失败（T-ACCESS-003 用户决策：配置缺失天然启动失败）
  jwt-secret-key: ${JWT_SECRET_KEY}

mybatis-flex:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: cn.ac.fage.accessmesh.access.admin.entity,cn.ac.fage.accessmesh.access.permission.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  # 安全评审 P2-5（2026-08-14）：显式最小化 actuator 暴露面——仅 health/info。
  # Boot 3.2 默认仅 web 暴露 health；此处为本地默认值，明确收敛到 health,info
  # （/actuator/** 为匿名公开路径，端口仅内网开放；注意 Nacos 配置优先级更高，
  # 生产覆盖需在 Nacos access-service.yml 保持一致的最小暴露）。
  endpoints:
    web:
      exposure:
        include: health,info

perm:
  internal-secret: ${PERM_INTERNAL_SECRET:}
  signature:
    secret: ${ACCESSMESH_SIGNATURE_SECRET:}
    valid-seconds: 300
  # T-ACCESS-008：原 perm.cache.l1/l2（expire-minutes/ttl-minutes）为无绑定死配置，已删除。
  # 缓存 TTL 唯一来源为各 CacheCatalog 代码声明；运维覆盖统一走
  # accessmesh.cache.default-config.* / accessmesh.cache.catalogs."<catalog>"（Duration 文法，如 10s/5m）。
  # 快照链路 6 目录（perm:effective-roles 等）有效 L2 TTL≤10s 由 PermCacheBoundaryValidator 启动强制。

file:
  storage:
    # T-ADMIN-023：文件存储根目录（本地磁盘）。
    # 单实例约束：多实例部署下本地盘不可共享为已知限制（元数据在共享 PG、物理文件在实例本地盘，
    # 跨实例上传/下载/删除会找不到文件）；多实例/对象存储场景未来另立任务，不建对象存储抽象层。
    path: ${user.home}/accessmesh-files

logging:
  config: classpath:log4j2-spring.xml
  level:
    cn.ac.fage.accessmesh: INFO
    org.springframework.cloud.loadbalancer: WARN
