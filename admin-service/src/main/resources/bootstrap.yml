server:
  port: 9100

spring:
  application:
    name: admin-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/admin_db?useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 1

sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: jwt
  is-log: false
  jwt-secret-key: ${JWT_SECRET_KEY}

mybatis-flex:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: cn.ac.fage.accessmesh.admin.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# permission-center 内部调用认证
# - perm.internal-secret 与 permission-center 端 perm.internal-secret 共享同一密钥
# - 通过 PERM_INTERNAL_SECRET 环境变量注入；密钥不进 git
# - perm.service-code 用于 permission-center 端 X-Service-Code 校验，固定为本服务编码
perm:
  internal-secret: ${PERM_INTERNAL_SECRET:}
  service-code: admin-service

logging:
  config: classpath:log4j2-spring.xml
